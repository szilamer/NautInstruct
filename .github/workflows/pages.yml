# NautInstruct közzététele GitHub Pages-en (ingyenes, nyilvános HTTPS).
# Nem igényel szervert, SSH-t vagy secretet. A Pages-t a workflow automatikusan bekapcsolja.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, cursor/naut-instruct-materials-and-spec-aef0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          BASE_PATH: /NautInstruct/
      - name: SPA fallback (404 -> index.html)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

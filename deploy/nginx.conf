server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: minden ismeretlen útvonalat az index.html-re irányítunk (kliensoldali routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hosszú távú cache a hash-elt asset fájloknak.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
